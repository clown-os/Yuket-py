; ============================================================
; 雨课堂本地刷课工具 配置文件
; 修改后重新运行 python main.py 即可生效
; ============================================================

[site]
; 雨课堂站点根地址。不同学校可能使用不同域名，例如：
;   https://www.yuketang.cn        （长江雨课堂/通用）
;   https://changjiang.yuketang.cn
;   https://gdufemooc.cn
base_url = https://www.yuketang.cn

; 启动时打开的页面（课程中心）。程序会列出课程供你选择
start_page = /v2/web/index


; 等待微信扫码登录的最长时间（秒）
login_timeout = 300

; 判断“已登录”的页面元素（逗号分隔，可自行补充学校页面的头像/用户名选择器）
login_selectors = .user-avatar, .avatar, .el-avatar, .user-name, .userInfo, .user-info, .nickname

; 登录二维码所在元素（无头模式下会截图保存为 qrcode.png）
qr_selectors = img[src^='data:image'], canvas, img[src*='qrcode'], img[src*='qr'], .qrcode img


[browser]
; 是否无头运行。第一次登录必须 false（需要你扫码）；登录态会保存在 profile_dir
headless = false

; 浏览器：chrome / msedge / chromium
channel = chrome

; 登录态（cookie、localStorage）保存目录，删掉该目录即可退出登录
profile_dir = browser_data

; 可选：浏览器代理。视频 CDN（ali-cdn.xuetangx.com）在部分网络下会连接超时，
; 可填写本地代理，例如 http://127.0.0.1:7890 或 socks5://127.0.0.1:7891
proxy =
; 代理账号密码（没有就留空）
proxy_username =
proxy_password =


[playback]
; 视频倍速（雨课堂播放器建议 1~2 倍；过高可能被平台限制）
speed = 2

; 是否静音
mute = true

; 课件 PPT 每页停留时间（秒）
ppt_interval = 3

; 仅旧路线回退（无「未完成」列表的课程）使用。
; 「未完成」列表流程始终是：先看状态 → 未完成就直接从 0 播放。
start_over = false

; 【重要】视频播放结束后，等待平台接收进度并显示“已完成”的最长时间（秒）。
; 超过该时间仍未完成，就触发“从头重播”
completion_timeout = 30

; 单个媒体元素的绝对等待上限（秒），0 表示按视频本身时长自动计算（时长 × 2.5 + 30）
media_timeout = 0

; 播放进度连续多少秒不前进就判定卡住（避免无限等待）
stall_timeout = 45

; 并行播放的标签页数量（1~8）。4 表示同时刷 4 个视频
workers = 4


[replay]
; 视频已经播完，但平台没有记为完成（进度上传失败/网络抖动）时，从头再看一遍
enabled = true

; 每个视频最多播放次数（含第一次）。例如 2 表示：正常播一遍失败后再从头播一遍
max_attempts = 2

; 重播时刷新页面：清空播放器状态，让平台重新上报进度（推荐开启）
reload_on_retry = true

; 重播次数用完后仍未完成，是否直接停止整个课程（false = 记录失败并继续下一个）
stop_on_fail = false


[answer]
; 是否启用自动答题
enabled = false

; 答题接口类型：
;   openai     OpenAI 兼容的 /chat/completions（DeepSeek、Kimi、硅基流动、one-api 等）
;   anthropic  Anthropic Messages API
;   custom     你自己的任意 HTTP 接口，见 README 的请求/响应格式
provider = openai

; 任意 OpenAI 兼容接口；视觉答题推荐：
;   智谱 GLM-5.3-Flash: https://open.bigmodel.cn/api/paas/v4/chat/completions
;   Z.ai 国际站:        https://api.z.ai/api/paas/v4/chat/completions
api_url = https://open.bigmodel.cn/api/paas/v4/chat/completions
api_key =
model = glm-5.3-flash

; 鉴权方式：bearer（Authorization: Bearer xxx）或 x-api-key（Anthropic 原生）
auth = bearer

; 单次请求超时（秒）
timeout = 180

; 单题最多请求几次（网络错误/答案解析失败时重试）
max_retries = 2

; 选出答案后是否自动点击“提交/保存”
auto_submit = true

; 是否处理「未完成 → 作业」（需要上面的 API 已启用且可用）
homework = true

; 是否把题目截图发给视觉模型（图片题、自定义字体必须开）
vision = true


[comment]
; 图文/讨论：自动复制已有第一条评论并发布（刷“讨论”完成度时可能用到）
enabled = false


[state]
; 断点续刷状态文件（记录当前刷到第几项、哪些项失败过）
file = state.json


[log]
; 日志目录
dir = logs
